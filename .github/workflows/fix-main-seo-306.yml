name: Fix AWS main SEO 306

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_main_seo_306.py'
      - '.github/workflows/fix-main-seo-306.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted AWS main SEO fix
        run: python tools/fix_main_seo_306.py
      - name: Commit index update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Restore AWS main SEO metadata for 306 questions'
            git push
          fi

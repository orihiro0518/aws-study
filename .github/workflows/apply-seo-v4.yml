name: Apply SEO v4

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_seo_v4.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply SEO and question fixes
        run: python tools/apply_seo_v4.py
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html robots.txt sitemap.xml */index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'SEO v4: metadata, structured data, sitemap and question fixes'
            git push
          fi

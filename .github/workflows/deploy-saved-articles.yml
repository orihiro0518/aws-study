name: Deploy saved AWS articles

on:
  push:
    paths:
      - '.github/workflows/deploy-saved-articles.yml'
      - 'tools/expand_saved_articles.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand security and storage guides
        run: python3 tools/expand_saved_articles.py
      - name: Commit article expansions
        run: |
          if git diff --quiet -- security-services/index.html s3-vs-ebs-vs-efs/index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-services/index.html s3-vs-ebs-vs-efs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Expand AWS security and storage guides"
          git push

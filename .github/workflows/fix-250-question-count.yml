name: Fix AWS question count to 250

on:
  push:
    paths:
      - '.github/workflows/fix-250-question-count.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove every stale 300-question claim from public content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Public/site content only. Workflow history is not published to the website.
          exts = {'.html', '.js', '.json', '.md', '.txt', '.xml'}
          changed = []
          stale = re.compile(r'300\s*問')

          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts or '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              n = stale.sub('250問', s)
              if n != s:
                  p.write_text(n, encoding='utf-8')
                  changed.append(str(p))

          print('Changed files:')
          print('\n'.join(changed) if changed else '(none; public source was already clean)')

          # Hard guard: no public text file may still claim 300 questions.
          bad = []
          for p in Path('.').rglob('*'):
              if p.is_file() and p.suffix.lower() in exts and '.git' not in p.parts:
                  t = p.read_text(encoding='utf-8')
                  if stale.search(t):
                      bad.append(str(p))
          if bad:
              raise SystemExit('Remaining stale question-count references: ' + ', '.join(bad))

          print('PASS: public AWS source contains zero 300-question references.')
          PY
      - name: Commit fixes if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No public content changes needed.'
          else
            git commit -m 'Remove remaining stale AWS question-count text'
            git push
          fi

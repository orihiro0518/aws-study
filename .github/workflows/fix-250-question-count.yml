name: Normalize AWS question count to 300-plus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize AWS question-count claims to 300問以上
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Normalize public content and generator source files after every main
          # update, so stale fixed counts cannot reappear in deployed content.
          # Workflow YAML is maintained directly because the Actions token cannot
          # create/update workflow files.
          exts = {'.html', '.js', '.json', '.md', '.txt', '.xml', '.py'}
          changed = []

          ja_count = re.compile(r'(?<!\d)(?:250|300|306)\s*問(?:以上)?')
          en_unique = re.compile(r'(?<!\d)(?:250|300|306)\s*\+?\s*Unique Questions', re.I)

          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts or '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              n = ja_count.sub('300問以上', s)
              n = en_unique.sub('300+ Unique Questions', n)
              if n != s:
                  p.write_text(n, encoding='utf-8')
                  changed.append(str(p))

          print('Changed files:')
          print('\n'.join(changed) if changed else '(none; source was already consistent)')

          remaining_ja = re.compile(r'(?<!\d)(?:250|306)\s*問|(?<!\d)300\s*問(?!以上)')
          remaining_en = re.compile(r'(?<!\d)(?:250|306)\s*\+?\s*Unique Questions|(?<!\d)300\s+Unique Questions', re.I)
          bad = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts or '.git' in p.parts:
                  continue
              t = p.read_text(encoding='utf-8')
              if remaining_ja.search(t) or remaining_en.search(t):
                  bad.append(str(p))

          if bad:
              raise SystemExit('Remaining stale question-count references: ' + ', '.join(bad))

          print('PASS: AWS question-count wording is normalized to 300問以上.')
          PY
      - name: Commit fixes if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No question-count changes needed.'
          else
            git commit -m 'Normalize AWS question count to 300問以上'
            git push
          fi

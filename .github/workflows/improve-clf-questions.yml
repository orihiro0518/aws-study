name: Improve CLF-C02 Questions
on:
  push:
    paths:
      - 'tools/improve_clf_questions.py'
      - '.github/workflows/improve-clf-questions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe targeted improvements
        run: python3 tools/improve_clf_questions.py
      - name: Validate and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'ある企業が新しいAWSアカウントを作成しました' in s
          assert '複数のリリース工程をつなぎ' in s
          assert '物理的なコンタクトセンター設備' in s
          assert '低レイテンシで利用でき、停止後もデータを保持' in s
          assert 'ETL処理をサーバー管理なしで実行' in s
          print('targeted validation passed')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Improve CLF-C02 scenario questions'
          git push
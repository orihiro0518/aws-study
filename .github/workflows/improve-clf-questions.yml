name: Improve CLF-C02 Questions

on:
  push:
    paths:
      - '.github/workflows/improve-clf-questions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted improvements
        run: python3 tools/improve_clf_questions.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Improve CLF-C02 scenario questions"
            git push
          fi

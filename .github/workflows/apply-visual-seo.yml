name: Apply favicon OG and article dates

on:
  push:
    paths:
      - '.github/workflows/apply-visual-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply ORIVECTOR visual SEO metadata and article dates
        run: |
          curl -fsSL https://raw.githubusercontent.com/orihiro0518/orihiro0518.github.io/main/tools/apply_visual_seo.py -o /tmp/apply_visual_seo.py
          python /tmp/apply_visual_seo.py --site aws --og https://orivector.jp/assets/og-aws.png
      - name: Commit SEO metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Add favicon OG images and article dates'
            git push
          fi
